name: lullabook
description: AI Bedtime Stories for Kids
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0
  cloud_functions: ^5.1.0
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.0
  firebase_remote_config: ^5.1.0

  # Subscriptions
  purchases_flutter: ^8.1.0
  purchases_ui_flutter: ^8.1.0

  # Local storage (hive — isar 3.x conflicts with freezed 2.5+)
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Auth
  sign_in_with_apple: ^6.1.2
  google_sign_in: ^6.2.1

  # Audio
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # Image / file
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0

  # UI
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8

  # Utilities
  crypto: ^3.0.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.5.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  flutter_dotenv: ^5.1.0

  # Observability
  sentry_flutter: ^8.7.0
  mixpanel_flutter: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/illustrations/
    - assets/animations/
    - assets/fonts/
    - .env
